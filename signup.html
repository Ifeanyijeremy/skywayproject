<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Skyway Travel</title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- Signup CSS -->

    <link
        rel="stylesheet"
        href="CSS/signup.css">

</head>


<body>


    <main class="signup-page">


        <!-- =====================================
             LEFT HERO
        ====================================== -->

        <section class="signup-hero">


            <div class="signup-hero-overlay"></div>


            <div class="signup-hero-content">


                <!-- Logo -->

                 <a
                    href="index.html"
                    class="signup-logo">
                  
                    <img
                        src="asset/logo/logo.png"
                        alt="Skyway Travel Logo">
                     <h3>Skyway <span>Travel</span></h3>
                </a>


                <!-- Hero Text -->

                <div class="signup-hero-message">

                    <h1>

                        Your journey

                        <span>begins here</span>

                    </h1>


                    <p>

                        book flights and amazing
                        <br>
                        experiences all in one place.

                    </p>

                </div>


            </div>

        </section>



        <!-- =====================================
             SIGNUP SECTION
        ====================================== -->

        <section class="signup-section">


            <div class="signup-container">


                <!-- Heading -->

                <div class="signup-header">

                    <h2>
                        Create your account
                    </h2>

                    <p>
                        Let’s get you started
                    </p>
                 </div>
              



                <!-- =================================
                     SIGNUP FORM
                ================================== -->

                <form
                    class="signup-form"
                    id="signupForm">


                    <!-- Full Name -->

                    <div class="signup-form-group">

                        <label for="fullName">
                            Full name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>

                    </div>



                    <!-- Email -->

                    <div class="signup-form-group">

                        <label for="signupEmail">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="signupEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>



                    <!-- Password -->

                    <div class="signup-form-group">

                        <label for="signupPassword">
                            Password
                        </label>


                        <div class="signup-password-wrapper">

                            <input
                                type="password"
                                id="signupPassword"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required>


                            <button
                                type="button"
                                class="signup-password-toggle"
                                id="signupPasswordToggle"
                                aria-label="Show password">

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>



                    <!-- Confirm Password -->

                    <div class="signup-form-group confirm-password-group">

                        <label for="confirmPassword">
                            Confirm password
                        </label>


                        <div class="signup-password-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                required>


                            <button
                                type="button"
                                class="signup-password-toggle"
                                id="confirmPasswordToggle"
                                aria-label="Show password">

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>



                    <!-- Terms -->

                    <div class="terms-row">


                        <label class="terms-label">


                            <input
                                type="checkbox"
                                id="terms"
                                name="terms"
                                required>


                            <span class="terms-checkbox"></span>


                            <span class="terms-text">

                                I agree to the

                                <a href="#">
                                    Terms of service
                                </a>

                                and

                                <a href="#">
                                    Privacy policy
                                </a>

                            </span>


                        </label>


                    </div>



                    <!-- Sign Up -->

                    <button
                        type="submit"
                        class="signup-btn">

                        Sign Up

                    </button>


                </form>



                <!-- =================================
                     SOCIAL DIVIDER
                ================================== -->

                <div class="signup-divider">

                    <span></span>

                    <p>
                        or continue with
                    </p>

                    <span></span>

                </div>



                <!-- Google -->

                <button
                    type="button"
                    class="signup-social-btn">

                    <span class="google-icon">
                        G
                    </span>

                    <span>
                        Continue with Google
                    </span>

                </button>



                <!-- Apple -->

                <button
                    type="button"
                    class="signup-social-btn">

                    <i class="fa-brands fa-apple"></i>

                    <span>
                        Continue with Apple
                    </span>

                </button>



                <!-- Login -->

                <p class="login-link">

                    Already have an account?

                    <a href="login.html">
                        Sign in
                    </a>

                </p>


            
           </div>
        </section>


    </main>



    <script src="JS/signup.js"></script>

</body>

</html>
